# Lives at .github/workflows/cells.yml of kpaha/skypin-ephemeris; the scripts are in cells/ there.
name: Cell tower files (OpenCelliD)

on:
  schedule:
    # Weekly, Monday UTC. Two entries at odd minutes because GitHub delays or skips scheduled runs
    # under load; a second run on the same day only repeats the download.
    - cron: "23 3 * * 1"
    - cron: "47 9 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cells/**", ".github/workflows/cells.yml"]

permissions:
  contents: write

concurrency:
  group: cells
  cancel-in-progress: false

jobs:
  cells:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: cells
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the OpenCelliD key secret
        id: key
        env:
          OPENCELLID_KEY: ${{ secrets.OPENCELLID_KEY }}
        run: |
          if [ -z "$OPENCELLID_KEY" ]; then
            echo "::warning::Repository secret OPENCELLID_KEY is missing (Settings > Secrets and variables > Actions): publishing the committed seed files from cells/seed instead of a fresh export."
            echo "present=0" >> "$GITHUB_OUTPUT"
          else
            echo "present=1" >> "$GITHUB_OUTPUT"
          fi

      # Without the key: the files converted by hand and committed under cells/seed (a partial export)
      # become the release, so the app has something to download. A keyed run replaces them.
      - name: Publish the seed files
        if: steps.key.outputs.present == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view cells --json assets -q '.assets[].name' 2>/dev/null | grep -qx manifest.json \
             && [ "$(gh release view cells --json body -q .body | grep -c 'seed')" = "0" ]; then
            echo "a full export is already published: keeping it"
          else
            ./cells.sh publish seed
            gh release edit cells --notes "$(gh release view cells --json body -q .body | grep -v '^Partial seed' ; echo; echo 'Partial seed export (Russia only) until the weekly job has its key.')"
          fi

      - name: Unit tests
        if: steps.key.outputs.present == '1'
        run: python3 -m unittest -v test_convert

      - name: Download and convert
        if: steps.key.outputs.present == '1'
        id: build
        continue-on-error: true
        env:
          OPENCELLID_KEY: ${{ secrets.OPENCELLID_KEY }}
        run: |
          mkdir -p out
          df -h . | tail -1
          set +e
          ./cells.sh build out 2>&1 | tee out/log.txt
          rc=${PIPESTATUS[0]}
          df -h . | tail -1 | tee -a out/log.txt
          echo "exit code $rc" | tee -a out/log.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Publish as the "cells" release assets
        if: steps.key.outputs.present == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OK: ${{ steps.build.outputs.rc == '0' && '1' || '0' }}
        run: |
          ./cells.sh publish out
          if [ "$BUILD_OK" != "1" ]; then echo "::error::download or conversion failed, see log.txt"; exit 1; fi
