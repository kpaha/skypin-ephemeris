name: Mirror broadcast ephemeris

on:
  schedule:
    - cron: "17 * * * *"   # every hour, UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download from IGS data centres
        id: download
        continue-on-error: true
        run: |
          mkdir -p out
          set +e
          ./mirror.sh out 2>&1 | tee out/log.txt
          rc=${PIPESTATUS[0]}
          echo "exit code $rc" | tee -a out/log.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Publish as the "current" release assets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag "latest" is kept away from GitHub's own /releases/latest route (its download URLs answered 504).
          gh release delete latest --yes --cleanup-tag >/dev/null 2>&1 || true
          if ! gh release view current >/dev/null 2>&1; then
            gh release create current --title "Current broadcast ephemeris" \
              --notes "Updated hourly by GitHub Actions. Files: brdc-today.rnx.gz, brdc-yesterday.rnx.gz, manifest.json"
          fi
          ls -la out
          gh release upload current out/log.txt --clobber
          if [ -s out/manifest.json ]; then gh release upload current out/manifest.json --clobber; fi
          for f in brdc-today.rnx.gz brdc-yesterday.rnx.gz; do
            if [ -s "out/$f" ]; then
              gh release upload current "out/$f" --clobber
            else
              echo "$f not available this run, keeping the previous asset if any"
            fi
          done
          echo "done"
          if [ "${{ steps.download.outputs.rc }}" != "0" ]; then echo "download step failed, see log.txt"; exit 1; fi
