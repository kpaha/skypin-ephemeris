name: Mirror broadcast ephemeris

on:
  schedule:
    - cron: "17 * * * *"   # every hour, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download from IGS data centres
        run: ./mirror.sh out

      - name: Publish as the "latest" release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest broadcast ephemeris" \
              --notes "Updated hourly by GitHub Actions. Files: brdc-today.rnx.gz, brdc-yesterday.rnx.gz, manifest.json" 
          ls out
          gh release upload latest out/manifest.json --clobber
          [ -s out/brdc-today.rnx.gz ] && gh release upload latest out/brdc-today.rnx.gz --clobber
          [ -s out/brdc-yesterday.rnx.gz ] && gh release upload latest out/brdc-yesterday.rnx.gz --clobber
          echo "done"
