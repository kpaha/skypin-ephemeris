name: Mirror broadcast ephemeris

on:
  schedule:
    - cron: "17 * * * *"   # every hour, UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download from IGS data centres
        run: ./mirror.sh out

      - name: Publish as the "latest" release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest broadcast ephemeris" \
              --notes "Updated hourly by GitHub Actions. Files: brdc-today.rnx.gz, brdc-yesterday.rnx.gz, manifest.json"
          fi
          ls -la out
          gh release upload latest out/manifest.json --clobber
          for f in brdc-today.rnx.gz brdc-yesterday.rnx.gz; do
            if [ -s "out/$f" ]; then
              gh release upload latest "out/$f" --clobber
            else
              echo "$f not available this run, keeping the previous asset if any"
            fi
          done
          echo "done"
